name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  claude-review-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          event_name = os.environ["GITHUB_EVENT_NAME"]
          repository = os.environ["GITHUB_REPOSITORY"]
          event_path = os.environ["GITHUB_EVENT_PATH"]
          token = os.environ["GITHUB_TOKEN"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          owner, repo = repository.split("/", 1)

          with open(event_path, "r", encoding="utf-8") as fh:
              event = json.load(fh)

          def set_output(name, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"{name}={value}\n")

          def gh(path):
              request = urllib.request.Request(
                  f"{api}{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "claude-review-gate",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          def body_is_review_trigger(value):
              return (value or "").strip() == "@claude review"

          def actor_has_write_access(login):
              try:
                  data = gh(f"/repos/{owner}/{repo}/collaborators/{login}/permission")
              except urllib.error.HTTPError:
                  return False
              return data.get("permission") in {"admin", "write"}

          def allow(reason):
              set_output("should_run", "true")
              set_output("reason", reason)

          def deny(reason):
              set_output("should_run", "false")
              set_output("reason", reason)

          pr = None
          actor = None

          if event_name == "issue_comment":
              if not event.get("issue", {}).get("pull_request"):
                  deny("issue comment is not on a pull request")
                  raise SystemExit(0)
              if not body_is_review_trigger(event.get("comment", {}).get("body")):
                  deny("issue comment is not exactly @claude review")
                  raise SystemExit(0)
              actor = (event.get("comment", {}).get("user") or {}).get("login")
              pr_number = event.get("issue", {}).get("number")
              pr = gh(f"/repos/{owner}/{repo}/pulls/{pr_number}")
          elif event_name == "pull_request_review_comment":
              if not body_is_review_trigger(event.get("comment", {}).get("body")):
                  deny("review comment is not exactly @claude review")
                  raise SystemExit(0)
              actor = (event.get("comment", {}).get("user") or {}).get("login")
              pr = event.get("pull_request")
          elif event_name == "pull_request_review":
              if not body_is_review_trigger(event.get("review", {}).get("body")):
                  deny("review body is not exactly @claude review")
                  raise SystemExit(0)
              actor = (event.get("review", {}).get("user") or {}).get("login")
              pr = event.get("pull_request")
          else:
              deny(f"unsupported event: {event_name}")
              raise SystemExit(0)

          if not pr:
              deny("missing pull request context")
              raise SystemExit(0)

          if pr.get("state") != "open":
              deny("pull request is not open")
              raise SystemExit(0)

          if ((pr.get("head") or {}).get("repo") or {}).get("full_name") != repository:
              deny("pull request head is from a fork")
              raise SystemExit(0)

          if (pr.get("user") or {}).get("login") == "dependabot[bot]":
              deny("dependabot pull request")
              raise SystemExit(0)

          if not actor or not actor_has_write_access(actor):
              deny("trigger actor lacks write access")
              raise SystemExit(0)

          allow("trusted same-repository pull request")
          PY

  claude-review:
    needs: claude-review-gate
    if: needs.claude-review-gate.outputs.should_run == 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude review"
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request for behavior-affecting issues. Prioritize:
            - Correctness bugs and regressions
            - Security or privacy risks
            - Risky edge cases and failure modes
            - Missing or weak tests for changed behavior

            Avoid style-only comments unless they affect maintainability, safety, or behavior.
            Do not edit files, create branches, push commits, or request repository write access.

            Use inline comments for specific changed lines when possible. Use a single top-level
            PR comment only for summary findings, cross-file issues, or when there are no
            actionable findings.
          claude_args: |
            --model ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5-5' }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
